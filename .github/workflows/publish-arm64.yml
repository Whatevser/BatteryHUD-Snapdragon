name: Publish lightweight BatteryHud (ARM64)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/publish-arm64.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify obsolete charging code is gone
        shell: pwsh
        run: |
          if (Test-Path src/AsusService.cs) { throw 'Obsolete ASUS charging controller still exists' }
          git grep -n -E 'AsusService|\.ChargeLimit|ShowAsFull|CeilingActive|DisplayPercent|ChargingCapBypass|CreateElevatedTask|RestartAsAdministrator' -- src
          if ($LASTEXITCODE -eq 0) { throw 'Obsolete charging/elevation code remains' }
          if ($LASTEXITCODE -ne 1) { throw "Source scan failed: $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          [xml]$proj = Get-Content -Raw src/BatteryHud.csproj
          if (-not $proj.Project.PropertyGroup.Version) { throw 'Project version missing' }

      - name: Publish framework-dependent single-file ARM64
        shell: pwsh
        run: |
          dotnet publish src/BatteryHud.csproj --configuration Release --runtime win-arm64 --self-contained false --output publish/win-arm64 -p:PublishSingleFile=true -p:PublishTrimmed=false -p:DebugType=none -p:DebugSymbols=false -p:IncludeNativeLibrariesForSelfExtract=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem publish/win-arm64 | Format-Table Name,Length
          if (-not (Test-Path publish/win-arm64/BatteryHud.exe)) { throw 'BatteryHud.exe not found' }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatteryHud-win-arm64-framework-dependent
          path: publish/win-arm64/BatteryHud.exe
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          [xml]$proj = Get-Content -Raw src/BatteryHud.csproj
          $tag = "v$($proj.Project.PropertyGroup.Version)"
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; not overwriting the published binary."
            exit 0
          }
          gh release create $tag publish/win-arm64/BatteryHud.exe --title "BatteryHud $tag (Windows ARM64)" --notes "Charge-limit controls and 80%-as-100% rescaling removed; use MyASUS for all charging-limit settings. Actual battery percentages, normal-user autostart, and improved rate smoothing. Framework-dependent Windows ARM64 EXE; requires .NET 10 Desktop Runtime ARM64." --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
