name: Publish lightweight BatteryHud (ARM64)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-arm64.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish framework-dependent single-file ARM64
        shell: pwsh
        run: |
          dotnet publish src/BatteryHud.csproj --configuration Release --runtime win-arm64 --self-contained false --output publish/win-arm64 -p:PublishSingleFile=true -p:PublishTrimmed=false -p:DebugType=none -p:DebugSymbols=false -p:IncludeNativeLibrariesForSelfExtract=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem publish/win-arm64 | Format-Table Name,Length
          if (-not (Test-Path publish/win-arm64/BatteryHud.exe)) { throw 'BatteryHud.exe not found' }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatteryHud-win-arm64-framework-dependent
          path: publish/win-arm64/BatteryHud.exe
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v0.3.3"
          gh release create $tag publish/win-arm64/BatteryHud.exe --title "BatteryHud $tag (Windows ARM64)" --notes "Includes timed Charging Cap Bypass. Small framework-dependent single-file build for Windows ARM64. Requires the .NET 10 Desktop Runtime (ARM64) installed separately. This build has not yet been hardware-tested." --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
